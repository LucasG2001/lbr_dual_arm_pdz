# MoveIt controller-manager config for driving both arms through
# cartesian_impedance_lbr_one/_two (see lbr_dual_arm_bringup/launch/
# cartesian_impedance.launch.py) instead of the default position-mode
# joint_trajectory_controller (moveit_controllers.yaml). Selected by passing
# use_cartesian_impedance:=true to move_group.launch.py.
#
# cartesian_impedance_controller now exposes a FollowJointTrajectory action
# per instance (cartesian_impedance_lbr_one/follow_joint_trajectory,
# cartesian_impedance_lbr_two/follow_joint_trajectory) that samples the
# incoming joint trajectory, drives the Cartesian task target through FK,
# and uses the trajectory directly as the nullspace target -- see
# CartesianImpedanceController::updateTrajectoryExecution().
#
# effort_controller_base's kinematic chain is single-chain, so -- same as
# dual_arm_cartesian_impedance_controllers.yaml -- each arm needs its own
# controller/action interface rather than one 14-joint controller.

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - cartesian_impedance_lbr_one
    - cartesian_impedance_lbr_two

  cartesian_impedance_lbr_one:
    type: FollowJointTrajectory
    joints:
      - lbr_one_A1
      - lbr_one_A2
      - lbr_one_A3
      - lbr_one_A4
      - lbr_one_A5
      - lbr_one_A6
      - lbr_one_A7
    action_ns: follow_joint_trajectory
    default: true

  cartesian_impedance_lbr_two:
    type: FollowJointTrajectory
    joints:
      - lbr_two_A1
      - lbr_two_A2
      - lbr_two_A3
      - lbr_two_A4
      - lbr_two_A5
      - lbr_two_A6
      - lbr_two_A7
    action_ns: follow_joint_trajectory
    default: true
