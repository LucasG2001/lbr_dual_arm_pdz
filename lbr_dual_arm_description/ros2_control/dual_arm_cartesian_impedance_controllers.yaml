      - lbr_two_A7
    delta_tau_max: 1.0 # Nm
    max_impedance_force: 70.0 # N -- caps a manual/streamed target_frame step's spring force (stiffness.trans_* * position delta); see limitTargetStep() in cartesian_impedance_controller.cpp
    max_impedance_torque: 20.0 # Nm -- same idea for orientation (stiffness.rot_* * angle)
    stiffness: # w.r.t. compliance_ref_link coordinates -- live-rereadable at runtime, see note above
      trans_x: 1500.0
      trans_y: 1500.0
