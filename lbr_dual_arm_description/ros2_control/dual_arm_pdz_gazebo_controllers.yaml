# controller_manager config for mode:=gazebo gripper:=pdz.
#
# ONE gz_ros2_control plugin instance (namespace /lbr_dual_arm_pdz -- see lbr_dual_arm.xacro's
# spawn_gazebo_plugin/xacro:lbr_gazebo_plugin, matching lbr_bringup's known-working single-arm
# pattern), loading TWO JointTrajectoryController instances into that one controller_manager, one
# per arm -- matches the real dual-arm rig's "one controller_manager, two per-arm controller
# instances" pattern (see lbr_dual_arm_description/ros2_control/
# dual_arm_cartesian_impedance_controllers.yaml for the real-hardware analog, a different
# controller type but the same instance topology). Each JointTrajectoryController claims only its
# own arm's 7 joints + its own gripper's driving joint -- no more cross-arm joint-list confusion,
# since there is now only one plugin instance to configure them from.
/**/controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller_lbr_one:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_trajectory_controller_lbr_two:
      type: joint_trajectory_controller/JointTrajectoryController

/**/joint_trajectory_controller_lbr_one:
  ros__parameters:
    joints:
      - lbr_one_A1
      - lbr_one_A2
      - lbr_one_A3
      - lbr_one_A4
      - lbr_one_A5
      - lbr_one_A6
      - lbr_one_A7
      - lbr_one_pdz_gripper_left_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true

/**/joint_trajectory_controller_lbr_two:
  ros__parameters:
    joints:
      - lbr_two_A1
      - lbr_two_A2
      - lbr_two_A3
      - lbr_two_A4
      - lbr_two_A5
      - lbr_two_A6
      - lbr_two_A7
      - lbr_two_pdz_gripper_left_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
